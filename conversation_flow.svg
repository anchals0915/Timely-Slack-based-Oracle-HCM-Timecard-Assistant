<svg width="100%" viewBox="0 0 680 760" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Timely conversation flow</title>
<desc>Flowchart showing the weekly Slack conversation flow for the Timely timecard assistant.</desc>
<style>
  text { font-family: ui-sans-serif, system-ui, sans-serif; fill: #1a1a1a; }
  .th { font-size: 13px; font-weight: 600; }
  .ts { font-size: 11px; fill: #555; }
  .arr { stroke: #888; stroke-width: 1.2; fill: none; }
  .scheduler-box { fill: #f1efe8; stroke: #b4b2a9; }
  .purple-box { fill: #eeedfe; stroke: #afa9ec; }
  .teal-box { fill: #e1f5ee; stroke: #5dcaa5; }
  .amber-box { fill: #faeeda; stroke: #ef9f27; }
  .gray-box { fill: #f1efe8; stroke: #b4b2a9; }
  .teal-text { fill: #085041; }
  .amber-text { fill: #633806; }
  .gray-text { fill: #444441; }
  .purple-text { fill: #3c3489; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Scheduler trigger -->
<rect x="190" y="20" width="300" height="44" rx="8" class="scheduler-box" stroke-width="0.5"/>
<text class="th gray-text" x="340" y="39" text-anchor="middle" dominant-baseline="central">APScheduler fires</text>
<text class="ts gray-text" x="340" y="55" text-anchor="middle" dominant-baseline="central">e.g. every Tuesday 12:00 PM</text>

<line x1="340" y1="64" x2="340" y2="94" class="arr" marker-end="url(#arrow)"/>

<!-- Bot DM -->
<rect x="180" y="94" width="320" height="56" rx="8" class="purple-box" stroke-width="0.5"/>
<text class="th purple-text" x="340" y="114" text-anchor="middle" dominant-baseline="central">Bot DMs user in Slack</text>
<text class="ts purple-text" x="340" y="134" text-anchor="middle" dominant-baseline="central">4 action buttons presented</text>

<line x1="340" y1="150" x2="340" y2="176" class="arr" marker-end="url(#arrow)"/>

<!-- Connector line to all 4 buttons -->
<line x1="99" y1="176" x2="555" y2="176" stroke="#888" stroke-width="0.5"/>
<line x1="99" y1="176" x2="99" y2="188" class="arr" marker-end="url(#arrow)"/>
<line x1="251" y1="176" x2="251" y2="188" class="arr" marker-end="url(#arrow)"/>
<line x1="403" y1="176" x2="403" y2="188" class="arr" marker-end="url(#arrow)"/>
<line x1="555" y1="176" x2="555" y2="188" class="arr" marker-end="url(#arrow)"/>

<!-- Button: Reuse Last Week -->
<rect x="30" y="188" width="138" height="44" rx="8" class="teal-box" stroke-width="0.5"/>
<text class="th teal-text" x="99" y="210" text-anchor="middle" dominant-baseline="central">Reuse last week</text>

<!-- Button: Enter Manually -->
<rect x="182" y="188" width="138" height="44" rx="8" class="teal-box" stroke-width="0.5"/>
<text class="th teal-text" x="251" y="210" text-anchor="middle" dominant-baseline="central">Enter manually</text>

<!-- Button: Remind Me Later -->
<rect x="334" y="188" width="138" height="44" rx="8" class="amber-box" stroke-width="0.5"/>
<text class="th amber-text" x="403" y="210" text-anchor="middle" dominant-baseline="central">Remind me later</text>

<!-- Button: Skip This Week -->
<rect x="486" y="188" width="138" height="44" rx="8" class="gray-box" stroke-width="0.5"/>
<text class="th gray-text" x="555" y="210" text-anchor="middle" dominant-baseline="central">Skip this week</text>

<!-- PATH 1: Reuse Last Week -->
<line x1="99" y1="232" x2="99" y2="270" class="arr" marker-end="url(#arrow)"/>
<rect x="30" y="270" width="138" height="52" rx="8" class="teal-box" stroke-width="0.5"/>
<text class="th teal-text" x="99" y="288" text-anchor="middle" dominant-baseline="central">Fetch last week</text>
<text class="ts teal-text" x="99" y="308" text-anchor="middle" dominant-baseline="central">from Oracle HCM</text>

<line x1="99" y1="322" x2="99" y2="354" class="arr" marker-end="url(#arrow)"/>
<rect x="30" y="354" width="138" height="52" rx="8" class="teal-box" stroke-width="0.5"/>
<text class="th teal-text" x="99" y="372" text-anchor="middle" dominant-baseline="central">Show draft</text>
<text class="ts teal-text" x="99" y="392" text-anchor="middle" dominant-baseline="central">Approve / Edit / Cancel</text>

<line x1="99" y1="406" x2="99" y2="436" class="arr" marker-end="url(#arrow)"/>
<line x1="99" y1="436" x2="175" y2="436" stroke="#888" stroke-width="0.8" fill="none"/>

<!-- PATH 2: Enter Manually -->
<line x1="251" y1="232" x2="251" y2="270" class="arr" marker-end="url(#arrow)"/>
<rect x="182" y="270" width="138" height="52" rx="8" class="teal-box" stroke-width="0.5"/>
<text class="th teal-text" x="251" y="288" text-anchor="middle" dominant-baseline="central">Entry modal</text>
<text class="ts teal-text" x="251" y="308" text-anchor="middle" dominant-baseline="central">Project / Task / Type</text>

<line x1="251" y1="322" x2="251" y2="354" class="arr" marker-end="url(#arrow)"/>
<rect x="182" y="354" width="138" height="52" rx="8" class="teal-box" stroke-width="0.5"/>
<text class="th teal-text" x="251" y="372" text-anchor="middle" dominant-baseline="central">Review preview</text>
<text class="ts teal-text" x="251" y="392" text-anchor="middle" dominant-baseline="central">Back / Submit</text>

<line x1="251" y1="406" x2="251" y2="436" class="arr" marker-end="url(#arrow)"/>
<line x1="251" y1="436" x2="175" y2="436" stroke="#888" stroke-width="0.8" fill="none"/>
<line x1="175" y1="436" x2="175" y2="450" class="arr" marker-end="url(#arrow)"/>

<!-- PATH 3: Remind Me Later -->
<line x1="403" y1="232" x2="403" y2="270" class="arr" marker-end="url(#arrow)"/>
<rect x="334" y="270" width="138" height="52" rx="8" class="amber-box" stroke-width="0.5"/>
<text class="th amber-text" x="403" y="288" text-anchor="middle" dominant-baseline="central">Snooze modal</text>
<text class="ts amber-text" x="403" y="308" text-anchor="middle" dominant-baseline="central">15 / 30 / 60 min or custom</text>

<line x1="403" y1="322" x2="403" y2="354" class="arr" marker-end="url(#arrow)"/>
<rect x="334" y="354" width="138" height="52" rx="8" class="amber-box" stroke-width="0.5"/>
<text class="th amber-text" x="403" y="372" text-anchor="middle" dominant-baseline="central">Reminder scheduled</text>
<text class="ts amber-text" x="403" y="392" text-anchor="middle" dominant-baseline="central">Re-pings at chosen time</text>

<!-- PATH 4: Skip This Week -->
<line x1="555" y1="232" x2="555" y2="270" class="arr" marker-end="url(#arrow)"/>
<rect x="486" y="270" width="138" height="52" rx="8" class="gray-box" stroke-width="0.5"/>
<text class="th gray-text" x="555" y="288" text-anchor="middle" dominant-baseline="central">Skip confirmed</text>
<text class="ts gray-text" x="555" y="308" text-anchor="middle" dominant-baseline="central">Links to Oracle HCM</text>

<!-- Submit to HCM -->
<rect x="88" y="450" width="264" height="56" rx="8" class="purple-box" stroke-width="0.5"/>
<text class="th purple-text" x="220" y="470" text-anchor="middle" dominant-baseline="central">Submit to Oracle HCM</text>
<text class="ts purple-text" x="220" y="490" text-anchor="middle" dominant-baseline="central">timeRecordEventRequests + statusChangeRequests</text>

<line x1="220" y1="506" x2="220" y2="538" class="arr" marker-end="url(#arrow)"/>

<!-- Confirmation -->
<rect x="88" y="538" width="264" height="44" rx="8" class="teal-box" stroke-width="0.5"/>
<text class="th teal-text" x="220" y="554" text-anchor="middle" dominant-baseline="central">Slack confirmation</text>
<text class="ts teal-text" x="220" y="572" text-anchor="middle" dominant-baseline="central">Success or failure message ✓</text>

<!-- Legend -->
<rect x="40" y="640" width="12" height="12" rx="2" fill="#1D9E75" opacity="0.7"/>
<text class="ts" x="58" y="646" dominant-baseline="central">Submit path</text>
<rect x="155" y="640" width="12" height="12" rx="2" fill="#EF9F27" opacity="0.7"/>
<text class="ts" x="173" y="646" dominant-baseline="central">Snooze path</text>
<rect x="270" y="640" width="12" height="12" rx="2" fill="#888780" opacity="0.7"/>
<text class="ts" x="288" y="646" dominant-baseline="central">Skip path</text>
<rect x="385" y="640" width="12" height="12" rx="2" fill="#7F77DD" opacity="0.7"/>
<text class="ts" x="403" y="646" dominant-baseline="central">Scheduler / confirm</text>
</svg>
