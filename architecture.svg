<svg width="100%" viewBox="0 0 680 500" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Timely architecture diagram</title>
<desc>Three-layer architecture: APScheduler, Slack Bolt App with core modules, and Oracle HCM REST APIs.</desc>
<style>
  text { font-family: ui-sans-serif, system-ui, sans-serif; fill: #1a1a1a; }
  .th { font-size: 13px; font-weight: 600; }
  .ts { font-size: 11px; }
  .arr { stroke: #888; stroke-width: 1.2; fill: none; }
  .amber-container { fill: #faeeda; stroke: #ef9f27; }
  .purple-container { fill: #eeedfe; stroke: #afa9ec; }
  .purple-inner { fill: #e0dffc; stroke: #7f77dd; }
  .gray-inner { fill: #f1efe8; stroke: #b4b2a9; }
  .teal-container { fill: #e1f5ee; stroke: #5dcaa5; }
  .dashed { fill: none; stroke: #b4b2a9; stroke-dasharray: 4 3; }
  .amber-text { fill: #633806; }
  .purple-text { fill: #3c3489; }
  .teal-text { fill: #085041; }
  .gray-text { fill: #444441; }
  .muted { fill: #666; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- LAYER 1: Scheduler -->
<rect x="40" y="24" width="600" height="70" rx="12" class="amber-container" stroke-width="0.5"/>
<text class="th amber-text" x="340" y="50" text-anchor="middle" dominant-baseline="central">APScheduler</text>
<text class="ts amber-text" x="340" y="70" text-anchor="middle" dominant-baseline="central">CronTrigger — fires weekly · iterates enrolled users · sends Slack DM per user</text>

<!-- Arrow + label -->
<line x1="340" y1="94" x2="340" y2="130" class="arr" marker-end="url(#arrow)"/>
<text class="ts muted" x="354" y="114" dominant-baseline="central">Socket Mode WebSocket</text>

<!-- LAYER 2: Slack Bolt outer -->
<rect x="40" y="130" width="600" height="230" rx="12" class="purple-container" stroke-width="0.5"/>
<text class="th purple-text" x="340" y="156" text-anchor="middle" dominant-baseline="central">Slack Bolt app</text>

<!-- Row 1 inner modules -->
<rect x="62" y="170" width="166" height="54" rx="8" class="purple-inner" stroke-width="0.5"/>
<text class="th purple-text" x="145" y="191" text-anchor="middle" dominant-baseline="central">app.py</text>
<text class="ts purple-text" x="145" y="209" text-anchor="middle" dominant-baseline="central">Entry point · scheduler</text>

<rect x="248" y="170" width="166" height="54" rx="8" class="purple-inner" stroke-width="0.5"/>
<text class="th purple-text" x="331" y="191" text-anchor="middle" dominant-baseline="central">handlers.py</text>
<text class="ts purple-text" x="331" y="209" text-anchor="middle" dominant-baseline="central">All Slack action handlers</text>

<rect x="434" y="170" width="174" height="54" rx="8" class="purple-inner" stroke-width="0.5"/>
<text class="th purple-text" x="521" y="191" text-anchor="middle" dominant-baseline="central">blocks.py</text>
<text class="ts purple-text" x="521" y="209" text-anchor="middle" dominant-baseline="central">Block Kit message builders</text>

<!-- Row 1 connectors -->
<line x1="228" y1="197" x2="248" y2="197" stroke="#9990e8" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="414" y1="197" x2="434" y2="197" stroke="#9990e8" stroke-width="0.5" marker-end="url(#arrow)"/>

<!-- Row 2 inner modules -->
<rect x="62" y="248" width="166" height="54" rx="8" class="gray-inner" stroke-width="0.5"/>
<text class="th gray-text" x="145" y="268" text-anchor="middle" dominant-baseline="central">draft_engine.py</text>
<text class="ts gray-text" x="145" y="286" text-anchor="middle" dominant-baseline="central">Build · edit · serialise drafts</text>

<rect x="248" y="248" width="166" height="54" rx="8" class="gray-inner" stroke-width="0.5"/>
<text class="th gray-text" x="331" y="268" text-anchor="middle" dominant-baseline="central">user_registry.py</text>
<text class="ts gray-text" x="331" y="286" text-anchor="middle" dominant-baseline="central">Slack ID ↔ HCM profile</text>

<rect x="434" y="248" width="174" height="54" rx="8" class="gray-inner" stroke-width="0.5"/>
<text class="th gray-text" x="521" y="268" text-anchor="middle" dominant-baseline="central">status_tracker.py</text>
<text class="ts gray-text" x="521" y="286" text-anchor="middle" dominant-baseline="central">Submission log · dedup</text>

<!-- hcm_client.py badge bridging -->
<rect x="265" y="348" width="150" height="28" rx="6" class="dashed"/>
<text class="ts gray-text" x="340" y="362" text-anchor="middle" dominant-baseline="central">hcm_client.py</text>

<!-- Arrow + label -->
<line x1="340" y1="360" x2="340" y2="360" class="arr"/>
<line x1="340" y1="360" x2="340" y2="390" class="arr" marker-end="url(#arrow)"/>
<text class="ts muted" x="354" y="378" dominant-baseline="central">REST + OAuth</text>

<!-- LAYER 3: Oracle HCM -->
<rect x="40" y="390" width="600" height="84" rx="12" class="teal-container" stroke-width="0.5"/>
<text class="th teal-text" x="340" y="414" text-anchor="middle" dominant-baseline="central">Oracle HCM Cloud REST APIs  (v11.13.18.05)</text>
<text class="ts teal-text" x="340" y="436" text-anchor="middle" dominant-baseline="central">timeRecords · timeRecordEventRequests · statusChangeRequests</text>
<text class="ts teal-text" x="340" y="456" text-anchor="middle" dominant-baseline="central">timeAttributes · timeAttributeValues · timeRecordGroups</text>
</svg>
